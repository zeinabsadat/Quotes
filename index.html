<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Quotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  /* کارت سفید بیرونی - ارتفاع 200 مثل ساعت و گالری */
  .quote-card {
    width: 460px;
    height: 200px;
    background: #ffffff;
    border-radius: 28px;
    box-shadow:
      0 10px 30px rgba(0, 0, 0, 0.08),
      0 2px 6px rgba(0, 0, 0, 0.04),
      inset 0 0 0 1px rgba(0, 0, 0, 0.03);
    padding: 11px;
    box-sizing: border-box;
  }

  /* بخش داخلی رنگی */
  .quote-inner {
    width: 100%;
    height: 100%;
    background: #d8c4be;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
  }

  .quote-mark {
    position: absolute;
    top: -2px;
    left: 18px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 75px;
    line-height: 1;
    color: #8a5a2a;
    opacity: 0.28;
    pointer-events: none;
    user-select: none;
  }

  .quote-slide {
    position: absolute;
    inset: 0;
    padding: 22px 26px 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    opacity: 0;
    transition: opacity 1s ease-in-out, transform 1s ease-in-out;
    transform: translateY(8px);
  }

  .quote-slide.active {
    opacity: 1;
    transform: translateY(0);
  }

  .quote-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 22px; /* افزایش سایز پایه */
    line-height: 1.3;
    color: #1a1a1a;
    margin: 0 0 8px 0;
    max-width: 100%;
  }

  .divider {
    width: 26px;
    height: 1.5px;
    background: #8a5a2a;
    border-radius: 1px;
    margin-bottom: 6px;
    opacity: 0.6;
  }

  .quote-author {
    font-family: 'Inter', sans-serif;
    font-size: 11.5px; /* افزایش سایز نام نویسنده */
    font-weight: 500;
    color: #6b4a3a;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="quote-card">
    <div class="quote-inner">
      <div class="quote-mark">"</div>
      <div id="container"></div>
    </div>
  </div>

<script>
  const quotes = [
    { text: "Be yourself; everyone else is already taken.", author: "Oscar Wilde" },
    { text: "In the end, it's not the years in your life that count. It's the life in your years.", author: "Abraham Lincoln" },
    { text: "The darkest hour has only sixty minutes.", author: "Morris West" },
    { text: "Our greatest glory is not in never falling, but in rising every time we fall.", author: "Confucius" },
    { text: "The only thing necessary for the triumph of evil is for good men to do nothing.", author: "Edmund Burke" },
    { text: "We become what we think about.", author: "Earl Nightingale" },
    { text: "A journey of a thousand miles begins with a single step.", author: "Lao Tzu" },
    { text: "Life is really simple, but we insist on making it complicated.", author: "Confucius" },
    { text: "Your limits exist only in your mind.", author: "Inspirational Proverb" },
    { text: "The best way to predict the future is to create it.", author: "Peter Drucker" }
  ];

  const intervalMs = 15000;

  quotes.sort(() => Math.random() - 0.5);

  const container = document.getElementById('container');
  const slides = [];

  quotes.forEach((q) => {
    const slide = document.createElement('div');
    slide.className = 'quote-slide';

    // تنظیم سایز فونت برای متن‌های کوتاه و بلند به صورت پله‌ای و بزرگتر
    let fontSize = 23;
    if (q.text.length > 70) fontSize = 20;
    if (q.text.length > 90) fontSize = 18;

    slide.innerHTML = `
      <p class="quote-text" style="font-size:${fontSize}px;">${q.text}</p>
      <div class="divider"></div>
      <p class="quote-author">${q.author}</p>
    `;
    container.appendChild(slide);
    slides.push(slide);
  });

  let current = 0;
  slides[0].classList.add('active');

  if (slides.length > 1) {
    setInterval(() => {
      const prev = current;
      current = (current + 1) % slides.length;

      slides[prev].classList.remove('active');
      setTimeout(() => {
        slides[current].classList.add('active');
      }, 400);
    }, intervalMs);
  }
</script>
</body>
</html>
